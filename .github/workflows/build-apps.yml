name: Build Android APK and Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform and build-tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows portable EXE (Go native)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build single-file Windows native EXE
        shell: bash
        run: |
          mkdir -p dist/windows
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-H=windowsgui -s -w" -o dist/windows/BluetoothPhoneAlerts.exe ./windows-go
          cp windows/install-windows.bat dist/windows/install-windows.bat
      - name: Upload Windows portable app
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: dist/windows/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Android-APK
          path: dist/android
      - uses: actions/download-artifact@v4
        with:
          name: Windows-EXE
          path: dist/windows
      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/android/app-debug.apk "dist/android/BluetoothPhoneAlerts-Android-${GITHUB_REF_NAME}-debug.apk"
          gh release create "$GITHUB_REF_NAME" \
            "dist/android/BluetoothPhoneAlerts-Android-${GITHUB_REF_NAME}-debug.apk" \
            dist/windows/BluetoothPhoneAlerts.exe \
            dist/windows/install-windows.bat \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "BluetoothPhoneAlerts $GITHUB_REF_NAME（测试版）" \
            --notes "纯蓝牙版。Android APK 为调试签名，仅供自行安装测试；Windows EXE 为未签名便携版。请先在手机和电脑之间完成蓝牙配对。" \
            --prerelease
